<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distribuye Inteligencia Artificial</title>
<!-- Fuente Montserrat para igualar el grosor y estilo de la captura -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Colores extraídos directamente de tu captura */
    --bg-top: #e8dbff;      /* Lila claro superior */
    --bg-bottom: #fce4f4;   /* Rosa claro inferior */
    --text-dark: #1a0f2e;   /* Negro/morado oscuro del título */
    --text-gray: #6b5b7b;   /* Gris de los párrafos */
    --gradient-start: #8a2be2; /* Morado del botón/borde */
    --gradient-end: #ff1493;   /* Rosa del botón/borde */
    --white: #ffffff;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Montserrat', sans-serif;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: var(--text-dark);
    /* Centrado en pantallas grandes para que no se estire demasiado */
    padding: 0 16px;
  }

  /* Barra superior idéntica a la de la captura (solo visible en móvil) */
  .top-bar {
    width: 100%;
    max-width: 480px;
    padding: 16px 8px;
    display: flex;
    align-items: center;
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--text-dark);
    margin-bottom: 10px;
  }

  .top-bar span {
    margin-left: 8px;
    opacity: 0.6;
    font-weight: 600;
  }

  /* Contenedor principal */
  .main-container {
    max-width: 480px;
    width: 100%;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 50px;
  }

  h1 {
    font-size: clamp(2.1rem, 7vw, 2.8rem);
    font-weight: 800;
    line-height: 1.15;
    margin-bottom: 20px;
    letter-spacing: -0.5px;
  }

  /* Palabra "distribuir" con degradado y cursiva */
  .highlight {
    font-style: italic;
    background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    display: inline-block;
    font-weight: 800;
  }

  .subtitle {
    font-size: 1.05rem;
    color: var(--text-gray);
    font-weight: 600;
    line-height: 1.5;
    margin-bottom: 35px;
    max-width: 400px;
  }

  .subtitle strong {
    font-weight: 800;
    color: var(--text-gray);
  }

  /* Marco del video con borde degradado exacto */
  .video-wrapper {
    width: 100%;
    background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
    padding: 4px;
    border-radius: 24px;
    margin-bottom: 16px;
    box-shadow: 0 8px 20px rgba(138, 43, 226, 0.15);
  }

  .video-inner {
    width: 100%;
    aspect-ratio: 16 / 9;
    background-color: var(--white);
    border-radius: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--text-gray);
    font-size: 0.9rem;
    font-weight: 600;
    text-align: center;
    padding: 20px;
    /* Aquí va tu <iframe> de YouTube o Vimeo */
  }

  .video-note {
    font-size: 0.9rem;
    color: var(--text-gray);
    font-weight: 500;
    margin-bottom: 30px;
  }

  /* Botón de WhatsApp idéntico al de la captura */
  .cta-button {
    width: 100%;
    display: block;
    background: linear-gradient(90deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
    color: var(--white);
    text-decoration: none;
    font-size: 1.1rem;
    font-weight: 700;
    padding: 20px 24px;
    border-radius: 50px;
    box-shadow: 0 10px 20px rgba(255, 20, 147, 0.3);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .cta-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 25px rgba(255, 20, 147, 0.4);
  }

  .cta-button:active {
    transform: translateY(1px);
  }

  /* Ocultar barra superior en escritorio */
  @media (min-width: 768px) {
    .top-bar {
      display: none;
    }
    .main-container {
      padding-top: 60px;
    }
  }
</style>
</head>
<body>

  <!-- Barra superior móvil -->
  <div class="top-bar">
    <b>Aivirallimpacto</b> <span>· Distribuye i...</span>
  </div>

  <main class="main-container">
    
    <!-- Título principal idéntico -->
    <h1>
      El futuro de los negocios digitales está en <span class="highlight">distribuir</span> inteligencia artificial.
    </h1>

    <!-- Subtítulo idéntico -->
    <p class="subtitle">
      Un sistema para construir un negocio con <strong>ingresos recurrentes y alcance internacional.</strong>
    </p>

    <!-- Espacio para video (puedes pegar tu iframe aquí) -->
    <div class="video-wrapper">
      <div class="video-inner">
        🎬 Espacio para el video
      </div>
    </div>

    <!-- Nota debajo del video -->
    <p class="video-note">Mira el video completo antes de continuar.</p>

    <!-- Botón "Quiero ver más" enlazado a tu WhatsApp -->
    <a href="https://wa.me/573232850508?text=Hola%2C%20quiero%20ver%20m%C3%A1s" 
       target="_blank" 
       rel="noopener noreferrer" 
       class="cta-button">
       Quiero ver más
    </a>

  </main>

</body>
</html>
