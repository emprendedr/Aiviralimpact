<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distribuye Inteligencia Artificial</title>
<!-- Importamos una fuente moderna y gruesa similar a la de la imagen -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Colores extraídos de la imagen */
    --bg-top: #e8dbff;
    --bg-bottom: #fce4f4;
    --text-dark: #1a0f2e;
    --text-gray: #6b5b7b;
    --gradient-start: #8a2be2; /* Morado */
    --gradient-end: #ff1493;   /* Rosa */
    --white: #ffffff;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Montserrat', sans-serif;
    /* Degradado de fondo de arriba a abajo */
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: var(--text-dark);
  }

  /* Barra superior simulando la app */
  .top-bar {
    width: 100%;
    padding: 15px 20px;
    display: flex;
    align-items: center;
    background: rgba(255, 255, 255, 0.4);
    backdrop-filter: blur(10px);
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--text-dark);
  }

  .top-bar span {
    margin-left: 10px;
    opacity: 0.7;
  }

  /* Contenedor principal (Mobile first) */
  .main-container {
    max-width: 500px;
    width: 100%;
    padding: 40px 24px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 {
    font-size: clamp(2.2rem, 7vw, 3rem);
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 24px;
    letter-spacing: -0.5px;
  }

  /* Efecto degradado para la palabra "distribuir" */
  .highlight {
    font-style: italic;
    background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    display: inline-block;
  }

  .subtitle {
    font-size: 1.1rem;
    color: var(--text-gray);
    font-weight: 500;
    line-height: 1.5;
    margin-bottom: 40px;
    max-width: 400px;
  }

  .subtitle strong {
    font-weight: 800;
    color: var(--text-gray);
  }

  /* Espacio para el video con borde degradado */
  .video-wrapper {
    width: 100%;
    background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
    padding: 4px; /* Grosor del borde */
    border-radius: 24px;
    margin-bottom: 16px;
  }

  .video-inner {
    width: 100%;
    aspect-ratio: 16 / 9; /* Proporción del video */
    background-color: var(--white);
    border-radius: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--text-gray);
    font-size: 0.9rem;
    font-weight: 500;
    text-align: center;
    padding: 20px;
    /* Aquí puedes insertar un iframe si el video es de YouTube/Vimeo */
  }

  .video-note {
    font-size: 0.9rem;
    color: var(--text-gray);
    margin-bottom: 35px;
  }

  /* Botón de WhatsApp (Llamado a la acción) */
  .cta-button {
    width: 100%;
    display: block;
    background: linear-gradient(90deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
    color: var(--white);
    text-decoration: none;
    font-size: 1.1rem;
    font-weight: 700;
    padding: 20px 24px;
    border-radius: 50px; /* Bordes totalmente redondos */
    box-shadow: 0 10px 20px rgba(255, 20, 147, 0.3);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .cta-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 25px rgba(255, 20, 147, 0.4);
  }

  .cta-button:active {
    transform: translateY(1px);
  }

  /* Ajustes para pantallas grandes (Escritorio) */
  @media (min-width: 768px) {
    .main-container {
      padding-top: 60px;
      padding-bottom: 60px;
    }
    .top-bar {
      display: none; /* Ocultamos la barra superior en PC */
    }
  }
</style>
</head>
<body>

  <!-- Barra superior (solo se ve en móviles, como en tu captura) -->
  <div class="top-bar">
    <b>Aivirallimpacto</b> <span>· Distribuye i...</span>
  </div>

  <main class="main-container">
    
    <!-- Título Principal -->
    <h1>
      El futuro de los negocios digitales está en <span class="highlight">distribuir</span> inteligencia artificial.
    </h1>

    <!-- Subtítulo -->
    <p class="subtitle">
      Un sistema para construir un negocio con <strong>ingresos recurrentes y alcance internacional.</strong>
    </p>

    <!-- Espacio reservado para el video -->
    <div class="video-wrapper">
      <div class="video-inner">
        <!-- Aquí puedes poner tu <iframe> de YouTube o Vimeo -->
        🎬 Espacio para el video
      </div>
    </div>

    <!-- Texto debajo del video -->
    <p class="video-note">Mira el video completo antes de continuar.</p>

    <!-- Botón de WhatsApp (Cambiado a "Quiero ver más") -->
    <a href="https://wa.me/573232850508?text=Hola%2C%20quiero%20ver%20m%C3%A1s" 
       target="_blank" 
       rel="noopener noreferrer" 
       class="cta-button">
       Quiero ver más
    </a>

  </main>

</body>
</html>
